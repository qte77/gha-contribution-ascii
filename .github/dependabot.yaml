# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # init, autobuild and analyze must run the same version: the analyze step
      # fails when init wrote its config with a different one.
      codeql-action:
        patterns:
          - "github/codeql-action*"
